name: Full stack integration

on:
  pull_request:
  push:
    branches: [main, dev-integration]

permissions:
  contents: read

jobs:
  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build images
        run: docker compose build
      - name: Start stack
        run: docker compose up -d --wait
      - name: API health check
        run: |
          curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-connrefused http://127.0.0.1:8080/healthz
      - name: Frontend and onboarding smoke checks
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-connrefused http://127.0.0.1:3000/ -o /tmp/doit-home.html
          curl --fail --silent --show-error http://127.0.0.1:3000/auth -o /tmp/doit-auth.html
          grep -q "Create a new account" /tmp/doit-auth.html
          curl --fail --silent --show-error http://127.0.0.1:8080/v1/onboarding/countries -o /tmp/doit-countries.json
          grep -q "items" /tmp/doit-countries.json
      - name: Assert protected profile requires authentication
        run: |
          status=$(curl -s -o /tmp/doit-unauthorized.json -w "%{http_code}" http://127.0.0.1:8080/v1/me)
          test "$status" = "401"
      - name: Seed and authenticate development test account
        env:
          DEV_TEST_EMAIL: ci-dev-user@example.test
          DEV_TEST_PASSWORD: ci-ephemeral-test-password-2026
        run: |
          bash scripts/seed-dev-test-user.sh
          bash scripts/seed-dev-test-user.sh
          python3 - <<'PY'
          import json, os, urllib.request
          payload=json.dumps({'email':os.environ['DEV_TEST_EMAIL'],'password':os.environ['DEV_TEST_PASSWORD']}).encode()
          req=urllib.request.Request('http://127.0.0.1:8080/v1/auth/login',data=payload,headers={'Content-Type':'application/json'})
          with urllib.request.urlopen(req) as response:
              data=json.load(response)
          assert data.get('access_token'), 'Login did not issue an access token'
          PY
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=150
      - name: Shut down
        if: always()
        run: docker compose down -v --remove-orphans

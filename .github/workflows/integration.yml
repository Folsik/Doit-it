name: Full stack integration

on:
  pull_request:
  push:
    branches: [main, dev-integration]

permissions:
  contents: read

jobs:
  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build images
        run: docker compose build
      - name: Start stack
        run: docker compose up -d --wait
      - name: API health check
        run: |
          curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-connrefused http://127.0.0.1:8080/healthz
      - name: Frontend and onboarding smoke checks
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-connrefused http://127.0.0.1:3000/ -o /tmp/doit-home.html
          curl --fail --silent --show-error http://127.0.0.1:3000/auth -o /tmp/doit-auth.html
          grep -q "Create a new account" /tmp/doit-auth.html
          curl --fail --silent --show-error http://127.0.0.1:8080/v1/onboarding/countries -o /tmp/doit-countries.json
          grep -q "items" /tmp/doit-countries.json
          curl --fail --silent --show-error http://127.0.0.1:3000/api/v1/onboarding/countries -o /tmp/doit-proxied-countries.json
          python3 - <<'PY'
          import json
          direct=json.load(open("/tmp/doit-countries.json"))
          proxied=json.load(open("/tmp/doit-proxied-countries.json"))
          assert proxied["items"] == direct["items"]
          assert any(item["code"] == "DE" for item in proxied["items"])
          PY
      - name: Assert protected profile requires authentication
        run: |
          status=$(curl -s -o /tmp/doit-unauthorized.json -w "%{http_code}" http://127.0.0.1:8080/v1/me)
          test "$status" = "401"
      - name: Seed and authenticate development test account
        env:
          DEV_TEST_EMAIL: ci-dev-user@example.test
          DEV_TEST_PASSWORD: ci-ephemeral-test-password-2026
        run: |
          bash scripts/seed-dev-test-user.sh
          bash scripts/seed-dev-test-user.sh
          python3 - <<'PY'
          import json, os, urllib.request
          payload=json.dumps({'email':os.environ['DEV_TEST_EMAIL'],'password':os.environ['DEV_TEST_PASSWORD']}).encode()
          req=urllib.request.Request('http://127.0.0.1:8080/v1/auth/login',data=payload,headers={'Content-Type':'application/json'})
          with urllib.request.urlopen(req) as response:
              data=json.load(response)
          assert data.get('access_token'), 'Login did not issue an access token'
          PY
      - name: Exercise authenticated profile settings through frontend
        env:
          DEV_TEST_EMAIL: ci-dev-user@example.test
          DEV_TEST_PASSWORD: ci-ephemeral-test-password-2026
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error, http.cookiejar
          base = 'http://127.0.0.1:3000'
          jar = http.cookiejar.CookieJar()
          client = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))
          def call(method, path, payload=None, expected=200):
              headers = {'Origin': base}
              data = None
              if payload is not None:
                  data = json.dumps(payload).encode()
                  headers['Content-Type'] = 'application/json'
              req = urllib.request.Request(base + path, data=data, headers=headers, method=method)
              try:
                  response = client.open(req, timeout=15)
              except urllib.error.HTTPError as e:
                  response = e
              result = json.load(response)
              assert response.status == expected, f'{method} {path}: HTTP {response.status}, {result}'
              return result
          credentials = {'email': os.environ['DEV_TEST_EMAIL'], 'password': os.environ['DEV_TEST_PASSWORD']}
          auth = urllib.request.Request('http://127.0.0.1:8080/v1/auth/login',data=json.dumps(credentials).encode(),headers={'Content-Type':'application/json'})
          with urllib.request.urlopen(auth) as response:
              token = json.load(response)['access_token']
          assert call('POST', '/api/session', {'access_token':token})['ok']
          user = call('GET', '/api/banking/v1/me')
          assert user['email'] == credentials['email']
          settings = call('GET', '/api/banking/v1/me/settings')
          assert settings['notifications_security'] is True
          dashboard = call('GET', '/api/banking/v1/dashboard')
          accounts = call('GET', '/api/banking/v1/accounts')['items']
          transactions = call('GET', '/api/banking/v1/transactions?limit=100')['items']
          assert len(accounts) == 1, 'New development user should own one account'
          assert all(a['currency'] == 'EUR' and a['balance_minor'] == 0 for a in accounts)
          assert dashboard['currency'] == 'EUR'
          assert dashboard['total_balance_minor'] == sum(a['balance_minor'] for a in accounts)
          assert dashboard['total_balance_minor'] == 0, 'New user must not see demo funds'
          assert dashboard['incoming_transfers_this_month_minor'] == 0
          assert dashboard['outgoing_transfers_this_month_minor'] == 0
          assert dashboard['completed_transfers_this_month'] == 0
          assert transactions == [], 'New user must not see fabricated transactions'
          updated = call('PUT','/api/banking/v1/me/address',{'address_line1':'42 Example Street','city':'Berlin','postal_code':'10115','address_line2':''})
          assert updated['city'] == 'Berlin'
          updated = call('PUT','/api/banking/v1/me/notifications',{'email':False,'push':True,'security':True})
          assert updated['notifications_email'] is False
          updated = call('PUT','/api/banking/v1/me/appearance',{'appearance':'dark'})
          assert updated['appearance'] == 'dark'
          updated = call('PATCH','/api/banking/v1/me',{'language_code':'de'})
          assert updated['language_code'] == 'de'
          assert call('GET','/api/banking/v1/me/settings')['appearance'] == 'dark'
          call('PATCH','/api/banking/v1/me',{'full_name':'Unauthorized Name'},403)
          call('POST','/api/banking/v1/me/identity/reverification',{},501)
          call('DELETE','/api/session')
          call('GET','/api/banking/v1/me',expected=401)
          print('Verified session, profile persistence, legal data guard and logout')
          PY
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=150
      - name: Shut down
        if: always()
        run: docker compose down -v --remove-orphans

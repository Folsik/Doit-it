services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: doit
      POSTGRES_USER: doit
      POSTGRES_PASSWORD: doit_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doit -d doit"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      APP_ENV: development
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://doit:doit_dev_password@postgres:5432/doit?sslmode=disable
      JWT_ISSUER: doit-api
      ACCESS_TOKEN_TTL: 15m
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:

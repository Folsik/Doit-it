services:
  postgres:
    image: postgres:17-alpine
    container_name: doit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: doit
      POSTGRES_USER: doit
      POSTGRES_PASSWORD: doit_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doit -d doit"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - doit

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: doit-api
    restart: unless-stopped
    environment:
      APP_ENV: development
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://doit:doit_dev_password@postgres:5432/doit?sslmode=disable
      JWT_ISSUER: doit-api
      ACCESS_TOKEN_TTL: 15m
      # Optional: base64url-encoded Ed25519 private key for persistent JWT signing.
      # Required when APP_ENV=production.
      # JWT_PRIVATE_KEY:
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - doit

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: doit-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Browser reaches the API via the published host port.
      NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - doit

volumes:
  postgres_data:

networks:
  doit:
    driver: bridge
